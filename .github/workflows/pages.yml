# Deploys the site to GitHub Pages and rebuilds videos/manifest.json from the files in videos/,
# so adding a video is just: drop videos/<slug>.mp4 in, commit, push.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - name: Build video manifest
        run: |
          cd videos
          python3 -c "import json,pathlib; print(json.dumps(sorted(p.name for p in pathlib.Path('.').iterdir() if p.suffix.lower() in ('.mp4', '.vtt'))))" > manifest.json
          cat manifest.json
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
