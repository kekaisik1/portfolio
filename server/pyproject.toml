[project]
name = "portfolio-api"
version = "0.1.0"
description = "The small API behind the portfolio: lanterns every visitor can see, and notes that reach Kaisar on Telegram."
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "httpx>=0.27",
    "uvicorn>=0.30",
]

[dependency-groups]
dev = ["mypy>=1.11", "pytest>=8", "ruff>=0.6"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "S"]
ignore = ["S101"]

[tool.mypy]
strict = true
python_version = "3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
